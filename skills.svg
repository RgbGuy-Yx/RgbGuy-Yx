<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 318" width="860" height="318" role="img" aria-label="Technical Skills Matrix">
  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .bg {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1;
    }
    .header-bar {
      fill: #161B22;
    }
    .cat-label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .skill-text {
      font-size: 11px;
      font-weight: 500;
      fill: #C9D1D9;
    }
    .pill-bg {
      fill: rgba(110, 118, 129, 0.1);
      stroke: #30363D;
      stroke-width: 1;
      transition: all 0.15s ease;
    }
    .skill-pill:hover .pill-bg {
      fill: rgba(56, 139, 253, 0.15);
      stroke: #58A6FF;
    }
    .skill-pill:hover .skill-text {
      fill: #58A6FF;
    }
    .circle-red { fill: #FF5F56; }
    .circle-yellow { fill: #FFBD2E; }
    .circle-green { fill: #27C93F; }
  </style>

